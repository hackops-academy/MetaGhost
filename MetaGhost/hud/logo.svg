<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Ghost Gradient -->
    <linearGradient id="ghostGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Scanner Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Drop Shadow for Ghost -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- App Icon Background with Round Corners -->
  <rect x="26" y="26" width="460" height="460" rx="90" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Faint Background Data Nodes / Connections -->
  <g stroke="#334155" stroke-width="2" fill="none" opacity="0.6">
    <!-- Left nodes -->
    <path d="M 80 110 L 130 160 L 130 260 L 90 300" />
    <circle cx="80" cy="110" r="4" fill="#475569" />
    <circle cx="130" cy="160" r="4" fill="#475569" />
    <circle cx="90" cy="300" r="4" fill="#475569" />
    <!-- Right nodes -->
    <path d="M 432 110 L 382 160 L 382 260 L 422 300" />
    <circle cx="432" cy="110" r="4" fill="#475569" />
    <circle cx="382" cy="160" r="4" fill="#475569" />
    <circle cx="422" cy="300" r="4" fill="#475569" />
  </g>

  <!-- Faint Background Metadata Brackets -->
  <text x="80" y="80" font-family="monospace" font-size="24" fill="#334155" opacity="0.5">{ }</text>
  <text x="390" y="380" font-family="monospace" font-size="24" fill="#334155" opacity="0.5">&lt;/&gt;</text>

  <!-- Main Ghost Shape -->
  <g filter="url(#dropShadow)">
    <path d="M 176 200
             A 80 80 0 0 1 336 200
             L 336 330
             Q 316 300 296 330
             Q 276 360 256 330
             Q 236 300 216 330
             Q 196 360 176 330
             Z" 
          fill="url(#ghostGrad)" />
  </g>

  <!-- Ghost Eyes (Code Brackets: < > ) -->
  <g stroke="#0f172a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Left Eye: < -->
    <path d="M 235 175 L 205 195 L 235 215" />
    <!-- Right Eye: > -->
    <path d="M 277 175 L 307 195 L 277 215" />
  </g>

  <!-- Extraction Scanner Beam -->
  <g filter="url(#glow)">
    <!-- Main Laser Line -->
    <line x1="140" y1="270" x2="372" y2="270" stroke="#38bdf8" stroke-width="4" />
    <!-- Edge Scanning Dots -->
    <circle cx="140" cy="270" r="6" fill="#ffffff" />
    <circle cx="372" cy="270" r="6" fill="#ffffff" />
    <!-- Scanning Gradient Overlay -->
    <rect x="176" y="270" width="160" height="40" fill="#38bdf8" opacity="0.15" />
  </g>

  <!-- Tool Name Text (Now inside the rounded square) -->
  <text x="256" y="415" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="38" fill="#e2e8f0" text-anchor="middle" letter-spacing="2">
    MetaGhost
  </text>
  
  <!-- Subtitle (Now inside the rounded square) -->
  <text x="256" y="445" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="14" fill="#94a3b8" text-anchor="middle" letter-spacing="4">
    DATA EXTRACTION
  </text>
</svg>
